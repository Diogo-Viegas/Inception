[www]
user = www-data
group = www-data
;Listening for FastCGI requests on port 9000 for every interface inside the docker network
listen = 0.0.0.0:9000

listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

;PHP runs in the root directory from the wordpress site
chdir = /var/www/html